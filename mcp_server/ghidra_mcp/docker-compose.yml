services:
  ghidra-mcp:
    image: ghidra-mcp-headless:latest
    restart: unless-stopped
    ports:
      - "8089:8089"
    volumes:
      - ${DIFFING_BASE_DIR:-C:/Users/User/Desktop/DiffingBaseDir}/ghidra_projects:/projects
      - ${DIFFING_BASE_DIR:-C:/Users/User/Desktop/DiffingBaseDir}/diffs:/diffs
    environment:
      - GHIDRA_MCP_PORT=8089
      - GHIDRA_MCP_AUTH_TOKEN=VVfCkbUUGkwstWwPJ8BKm7kL8jw1hJHY
      - JAVA_OPTS=-Xmx4g