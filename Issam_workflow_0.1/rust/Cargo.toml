[package]
name = "dll_downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.36", features = ["full"] }
futures = "0.3"
indicatif = "0.17"
sha2 = "0.10"
hex = "0.4"
flate2 = "1.0"
